name: Stage system verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-system-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Remove one-off workflow after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name frontline-ci
          git config user.email frontline-ci@users.noreply.github.com
          git rm .github/workflows/stage-system-verify.yml
          git commit -m 'chore: remove completed stage system verifier'
          git push origin HEAD:main
