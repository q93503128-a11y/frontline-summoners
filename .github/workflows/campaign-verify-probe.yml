name: Campaign verification probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/campaign-verify-probe.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify current canonical main
        shell: bash
        run: |
          set +e

          npm ci --ignore-scripts > /tmp/install.log 2>&1
          install_status=$?

          if [ "$install_status" -eq 0 ]; then
            npm run typecheck > /tmp/typecheck.log 2>&1
            typecheck_status=$?
            npm test -w @frontline/client > /tmp/client-test.log 2>&1
            client_test_status=$?
            npm test > /tmp/test.log 2>&1
            test_status=$?
            npm run build > /tmp/build.log 2>&1
            build_status=$?
          else
            typecheck_status=99
            client_test_status=99
            test_status=99
            build_status=99
            : > /tmp/typecheck.log
            : > /tmp/client-test.log
            : > /tmp/test.log
            : > /tmp/build.log
          fi

          {
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'verified_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'install=%s\n' "$install_status"
            printf 'typecheck=%s\n' "$typecheck_status"
            printf 'client_test=%s\n' "$client_test_status"
            printf 'test=%s\n' "$test_status"
            printf 'build=%s\n' "$build_status"
            printf '\n== client test failures ==\n'
            grep -E '^(not ok|# Subtest:|# fail|# pass|# tests)|AssertionError|ERR_|failed with|exceeded|expected' /tmp/client-test.log | tail -n 240
            printf '\n== client test tail ==\n'
            tail -n 260 /tmp/client-test.log
            printf '\n== build tail ==\n'
            tail -n 140 /tmp/build.log
          } > docs/CI_PROBE_RESULT.txt

          git config user.name "frontline-ci"
          git config user.email "frontline-ci@users.noreply.github.com"
          git rm .github/workflows/campaign-verify-probe.yml
          git add docs/CI_PROBE_RESULT.txt
          git commit -m "chore: record campaign verification probe"
          git push origin HEAD:main

          if [ "$install_status" -ne 0 ] || [ "$typecheck_status" -ne 0 ] || [ "$client_test_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            exit 1
          fi
