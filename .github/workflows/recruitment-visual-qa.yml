name: Recruitment visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recruitment-visual-qa.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install capture browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Start client directly
        run: |
          cd apps/client
          npx vite --host 127.0.0.1 --port 4173 > /tmp/frontline-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/frontline-vite.log
          exit 1
      - name: Capture recruitment desktop and mobile
        run: |
          mkdir -p visual-qa
          cat > /tmp/recruitment-capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          async function capture(name, viewport) {
            const page = await browser.newPage({ viewport });
            const browserErrors = [];
            page.on('pageerror', (error) => browserErrors.push(String(error)));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const canvas = page.locator('canvas');
            await canvas.waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForTimeout(1800);
            const box = await canvas.boundingBox();
            if (!box) throw new Error('game canvas has no layout box');
            await page.mouse.click(box.x + box.width * (820 / 1280), box.y + box.height * (445 / 720));
            await page.waitForTimeout(1800);
            await page.screenshot({ path: `visual-qa/recruitment-${name}.png`, fullPage: true });
            const finalBox = await canvas.boundingBox();
            if (finalBox) await canvas.screenshot({ path: `visual-qa/recruitment-${name}-canvas.png` });
            if (browserErrors.length) console.log(`${name} page errors:\n${browserErrors.join('\n')}`);
            await page.close();
          }
          await capture('desktop-1280x720', { width: 1280, height: 720 });
          await capture('mobile-390x844', { width: 390, height: 844 });
          await browser.close();
          EOF
          node /tmp/recruitment-capture.mjs
      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-visual-qa
          path: visual-qa/*.png
          if-no-files-found: error
