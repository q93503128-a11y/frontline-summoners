name: Full post-rebalance verification probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/full-verify-probe.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run and record full verification
        shell: bash
        run: |
          set +e
          npm install --ignore-scripts > /tmp/install.log 2>&1
          INSTALL=$?
          npm run typecheck > /tmp/typecheck.log 2>&1
          TYPECHECK=$?
          npm test > /tmp/test.log 2>&1
          TEST=$?
          npm run build > /tmp/build.log 2>&1
          BUILD=$?
          set -e

          {
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'verified_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'install=%s\n' "$INSTALL"
            printf 'typecheck=%s\n' "$TYPECHECK"
            printf 'test=%s\n' "$TEST"
            printf 'build=%s\n\n' "$BUILD"
            printf '== test failures ==\n'
            grep -E '^(not ok|# fail|npm error)' /tmp/test.log || true
            printf '\n== test tail ==\n'
            tail -n 160 /tmp/test.log || true
            printf '\n== typecheck tail ==\n'
            tail -n 60 /tmp/typecheck.log || true
            printf '\n== build tail ==\n'
            tail -n 100 /tmp/build.log || true
          } > docs/FULL_VERIFY_RESULT.txt

          git config user.name frontline-ci
          git config user.email frontline-ci@users.noreply.github.com
          git rm .github/workflows/full-verify-probe.yml
          git add docs/FULL_VERIFY_RESULT.txt
          git commit -m 'chore: record full post-rebalance verification'
          git push origin HEAD:main
