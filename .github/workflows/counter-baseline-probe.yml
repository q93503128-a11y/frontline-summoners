name: Trait-aware campaign baseline probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/counter-baseline-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare trait-aware reserve policy
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts >/tmp/install.log 2>&1
          cp apps/client/test/campaign-baseline.ts /tmp/baseline-original.ts
          cp content/stages/chapter-01.json /tmp/stages-original.json

          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/client/test/campaign-baseline.ts')
          s=p.read_text()
          needle='''function alivePlayerUnitCount(state: ReturnType<typeof createPrototypeBattle>): number {
  return state.battle.units.filter((unit) => unit.team === 'PLAYER' && unit.state !== 'DYING').length;
}
'''
          repl=needle+'''\nfunction selectReadyTraitCounter(state: ReturnType<typeof createPrototypeBattle>) {
  const activeEnemies = state.battle.units.filter((unit) =>
    unit.team === 'ENEMY' && unit.state !== 'DYING' && unit.state !== 'NATURAL_KNOCKBACK'
  );
  if (activeEnemies.length === 0) return null;
  const activeTraits = new Set(activeEnemies.flatMap((unit) => unit.definition.traits ?? []));
  const wallet = getCurrentSupplyLevel(state).maxSupply;
  const scored = state.playerSlots.flatMap((slot) => {
    if (slot.cost > wallet || getCooldownRemaining(state, slot.slotId) > 0) return [];
    const matching = (slot.definition.damageBonuses ?? []).filter((bonus) => activeTraits.has(bonus.trait));
    if (matching.length === 0) return [];
    const multiplier = Math.max(...matching.map((bonus) => bonus.multiplierPermille));
    const cycle = Math.max(1, slot.definition.attackTiming.cycleFrames);
    const score = (slot.definition.attackDamage * multiplier) / cycle;
    return [{ slot, score, multiplier }];
  });
  scored.sort((a, b) => b.score - a.score || b.multiplier - a.multiplier || b.slot.cost - a.slot.cost);
  return scored[0]?.slot ?? null;
}
'''
          if needle not in s: raise SystemExit('helper insertion point missing')
          s=s.replace(needle,repl,1)
          needle2='''    const emergencyPressure = enemiesAtDecision > 0 && alivePlayersAtDecision <= EMERGENCY_FRONTLINE_COUNT;
    const emergencySpawned = emergencyPressure && spawnStrongestAffordableNow();

    if (!emergencySpawned) {
'''
          repl2='''    const emergencyPressure = enemiesAtDecision > 0 && alivePlayersAtDecision <= EMERGENCY_FRONTLINE_COUNT;
    const emergencySpawned = emergencyPressure && spawnStrongestAffordableNow();
    const traitCounter = !emergencyPressure && stageIndex >= OPENING_ECONOMY_STAGE_INDEX && alivePlayersAtDecision >= 4
      ? selectReadyTraitCounter(state)
      : null;
    let counterHandled = false;
    if (!emergencySpawned && traitCounter) {
      if (state.supply >= traitCounter.cost) recordSpawn(traitCounter.slotId);
      counterHandled = true;
    }

    if (!emergencySpawned && !counterHandled) {
'''
          if needle2 not in s: raise SystemExit('loop insertion point missing')
          p.write_text(s.replace(needle2,repl2,1))
          PY

          run_final() {
            LABEL="$1"
            LABEL="$LABEL" node --experimental-transform-types --input-type=module >> /tmp/counter.log 2>&1 <<'NODE'
          const { STAGES } = await import(`./apps/client/src/prototype.ts?${Date.now()}-${Math.random()}`);
          const { autoPlayCampaignStage } = await import(`./apps/client/test/campaign-baseline.ts?${Date.now()}-${Math.random()}`);
          const limits=[330,345,360,390,450];
          const cleared=STAGES.slice(0,15).map(s=>s.id);
          for(let i=15;i<20;i++){
            const r=autoPlayCampaignStage(i,cleared,{maxSeconds:limits[i-15],cannonBaseRatio:.75});
            const b=r.state.battle;
            console.log(JSON.stringify({label:process.env.LABEL,stage:i+1,winner:b.winner,seconds:+(b.tick/30).toFixed(1),p:+(b.bases.PLAYER.hp/b.bases.PLAYER.maxHp).toFixed(4),e:+(b.bases.ENEMY.hp/b.bases.ENEMY.maxHp).toFixed(4),level:r.state.supplyLevel,spawns:r.telemetry.spawnCount,upgrades:r.telemetry.upgradeCount,players:[...r.telemetry.seenPlayerIds],boss:r.seenEnemyIds.has('enemy-boss'),iron:r.seenEnemyIds.has('enemy-boss-iron')}));
            if(b.winner==='PLAYER') cleared.push(STAGES[i].id); else break;
          }
          NODE
          }

          : > /tmp/counter.log
          run_final current_stage_counter

          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const s=JSON.parse(readFileSync('/tmp/stages-original.json','utf8'));
          const w=s[19].waves;
          w[0].atTick=450; w[1].atTick=900; w[2].atTick=1800; w[3].atTick=2100; w[4].atTick=3000;
          writeFileSync('content/stages/chapter-01.json',JSON.stringify(s,null,2)+'\n');
          NODE
          run_final delay_only_counter

          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const s=JSON.parse(readFileSync('/tmp/stages-original.json','utf8'));
          const w=s[19].waves;
          w[0].atTick=450; w[1].count=1; w[1].atTick=900; w[2].atTick=1800; w[3].atTick=2100; w[4].atTick=3000;
          writeFileSync('content/stages/chapter-01.json',JSON.stringify(s,null,2)+'\n');
          NODE
          run_final delay_light_counter

          cp /tmp/baseline-original.ts apps/client/test/campaign-baseline.ts
          cp /tmp/stages-original.json content/stages/chapter-01.json
          {
            printf 'source_sha=%s\n\n' "$GITHUB_SHA"
            cat /tmp/counter.log
          } > docs/COUNTER_BASELINE_PROBE_RESULT.txt

          git config user.name frontline-ci
          git config user.email frontline-ci@users.noreply.github.com
          git rm .github/workflows/counter-baseline-probe.yml
          git add docs/COUNTER_BASELINE_PROBE_RESULT.txt
          git commit -m 'chore: record trait-aware baseline probe'
          git push origin HEAD:main
