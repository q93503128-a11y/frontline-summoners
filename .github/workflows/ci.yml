name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test content schema
        run: npm run test -w @frontline/content-schema
      - name: Test simulation
        if: always()
        run: npm run test -w @frontline/sim
      - name: Diagnose failing client tests
        if: always()
        shell: bash
        run: |
          cd apps/client
          failed=0
          for file in \
            battle-ui-wiring.test.ts \
            canonical-economy-docs.test.ts \
            catalog-boss-mobile-ui.test.ts \
            design-coverage.test.ts \
            final-campaign-balance.test.ts \
            mid-campaign-balance.test.ts \
            permanent-rewards.test.ts \
            player-loadout.test.ts \
            progression.test.ts \
            recruitment-save.test.ts \
            recruitment.test.ts \
            recurring-stage-pressure.test.ts \
            save-progress.test.ts \
            solo-pause-economy.test.ts \
            special-baseline.test.ts \
            stage-navigation.test.ts
          do
            echo "### $file" | tee -a "$GITHUB_STEP_SUMMARY"
            status=0
            node --experimental-transform-types --test "test/$file" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
            if [[ $status -ne 0 ]]; then failed=1; fi
            echo | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit $failed
      - name: Test client suite
        if: always()
        run: npm run test -w @frontline/client
      - name: Build
        if: success()
        run: npm run build
