name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test content schema - attack pattern
        run: node --experimental-transform-types --test packages/content-schema/test/attack-pattern.test.ts
      - name: Test content schema - campaign
        if: always()
        run: node --experimental-transform-types --test packages/content-schema/test/campaign.test.ts
      - name: Test content schema - canonical v1
        if: always()
        run: node --experimental-transform-types --test packages/content-schema/test/canonical-v1.test.ts
      - name: Test content schema - wave repeat
        if: always()
        run: node --experimental-transform-types --test packages/content-schema/test/wave-repeat.test.ts
      - name: Test simulation
        if: always()
        run: npm run test -w @frontline/sim
      - name: Test client
        if: always()
        run: npm run test -w @frontline/client
      - name: Build
        if: success()
        run: npm run build
