name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"
      - name: Check production asset intake
        run: npm run assets:production:check
      - name: Test content schema
        run: npm run test -w @frontline/content-schema
      - name: Test simulation
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run test -w @frontline/sim 2>&1 | tee "$RUNNER_TEMP/sim-test.log"
      - name: Test server co-op protocol
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run test -w @frontline/server 2>&1 | tee "$RUNNER_TEMP/server-test.log"
      - name: Upload core verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification-diagnostics
          path: |
            ${{ runner.temp }}/typecheck.log
            ${{ runner.temp }}/sim-test.log
            ${{ runner.temp }}/server-test.log
          if-no-files-found: warn
          retention-days: 3
      - name: Diagnose failing client tests
        if: always()
        shell: bash
        run: |
          cd apps/client
          diagnostics="$RUNNER_TEMP/client-test-diagnostics"
          mkdir -p "$diagnostics"
          failed=0
          : > "$diagnostics/failed-tests.txt"
          for path in test/*.test.ts; do
            file="${path#test/}"
            echo "### $file" | tee -a "$GITHUB_STEP_SUMMARY"
            status=0
            node --experimental-transform-types --test "$path" > "$diagnostics/$file.log" 2>&1 || status=$?
            cat "$diagnostics/$file.log" >> "$GITHUB_STEP_SUMMARY"
            if [[ $status -ne 0 ]]; then
              echo "$file" | tee -a "$diagnostics/failed-tests.txt"
              failed=1
            fi
            echo | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit $failed
      - name: Upload client test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-diagnostics
          path: ${{ runner.temp }}/client-test-diagnostics
          if-no-files-found: error
          retention-days: 3
      - name: Test client suite
        if: always()
        run: npm run test -w @frontline/client
      - name: Build
        if: success()
        run: npm run build
      - name: Persist validated production runtime assets
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generated_paths=(
            apps/client/public/assets/production/units
            apps/client/public/assets/production/battlefields
            apps/client/public/assets/production/audio
            apps/client/public/assets/production/review
            assets/raw/production/review/vertical-slice-01/preflight
          )
          for path in "${generated_paths[@]}"; do
            if [[ -e "$path" ]]; then
              git add "$path"
            else
              echo "Generated path not present in this run; skipping pathspec: $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "Generated production runtime/review assets are already current."
            exit 0
          fi

          git commit -m "chore(art): persist production runtime and review assets [skip ci]"
          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "main advanced from $GITHUB_SHA to $remote_head; skipping stale generated-asset persistence."
            exit 0
          fi

          if git push origin HEAD:main; then
            exit 0
          fi

          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "main advanced during generated-asset push; newer CI owns persistence."
            exit 0
          fi

          echo "Generated asset push failed while main still points at this workflow SHA."
          exit 1
