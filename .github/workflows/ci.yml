name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"
      - name: Check production asset intake
        run: npm run assets:production:check
      - name: Test content schema
        run: npm run test -w @frontline/content-schema
      - name: Test simulation
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run test -w @frontline/sim 2>&1 | tee "$RUNNER_TEMP/sim-test.log"
      - name: Test server co-op protocol
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run test -w @frontline/server 2>&1 | tee "$RUNNER_TEMP/server-test.log"
      - name: Upload core verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification-diagnostics
          path: |
            ${{ runner.temp }}/typecheck.log
            ${{ runner.temp }}/sim-test.log
            ${{ runner.temp }}/server-test.log
          if-no-files-found: warn
          retention-days: 3
      - name: Test client suite
        if: always()
        run: npm run test -w @frontline/client
      - name: Build
        if: success()
        run: npm run build
      - name: Persist validated non-character production assets
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Character/unit production art is intentionally quarantined until the
          # character-design phase. Only validated non-character runtime assets
          # may be persisted by CI in the meantime.
          generated_paths=(
            apps/client/public/assets/production/battlefields
            apps/client/public/assets/production/audio
          )
          for path in "${generated_paths[@]}"; do
            if [[ -e "$path" ]]; then
              git add -f "$path"
            else
              echo "Generated path not present in this run; skipping pathspec: $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "Generated non-character production assets are already current."
            exit 0
          fi

          git commit -m "chore(art): persist non-character production assets [skip ci]"
          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "main advanced from $GITHUB_SHA to $remote_head; skipping stale generated-asset persistence."
            exit 0
          fi

          if git push origin HEAD:main; then
            exit 0
          fi

          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "main advanced during generated-asset push; newer CI owns persistence."
            exit 0
          fi

          echo "Generated asset push failed while main still points at this workflow SHA."
          exit 1
