name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test content schema
        run: npm run test -w @frontline/content-schema
      - name: Test simulation
        if: always()
        run: npm run test -w @frontline/sim
      - name: Client - art content
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/art-content.test.ts
      - name: Client - battle ui wiring
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/battle-ui-wiring.test.ts
      - name: Client - canonical economy docs
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/canonical-economy-docs.test.ts
      - name: Client - catalog boss mobile ui
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/catalog-boss-mobile-ui.test.ts
      - name: Client - character growth
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/character-growth.test.ts
      - name: Client - combat trait labels
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/combat-trait-labels.test.ts
      - name: Client - combat visuals
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/combat-visuals.test.ts
      - name: Client - design coverage
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/design-coverage.test.ts
      - name: Client - early campaign balance
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/early-campaign-balance.test.ts
      - name: Client - final campaign balance
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/final-campaign-balance.test.ts
      - name: Client - late campaign balance
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/late-campaign-balance.test.ts
      - name: Client - mid campaign balance
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/mid-campaign-balance.test.ts
      - name: Client - permanent rewards
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/permanent-rewards.test.ts
      - name: Client - player loadout
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/player-loadout.test.ts
      - name: Client - progression
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/progression.test.ts
      - name: Client - projectile visuals
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/projectile-visuals.test.ts
      - name: Client - recruitment save
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/recruitment-save.test.ts
      - name: Client - recruitment ui wiring
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/recruitment-ui-wiring.test.ts
      - name: Client - recruitment
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/recruitment.test.ts
      - name: Client - recurring stage pressure
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/recurring-stage-pressure.test.ts
      - name: Client - save progress
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/save-progress.test.ts
      - name: Client - solo pause economy
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/solo-pause-economy.test.ts
      - name: Client - special baseline
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/special-baseline.test.ts
      - name: Client - special stages
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/special-stages.test.ts
      - name: Client - stage navigation
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/stage-navigation.test.ts
      - name: Client - starter balance
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/starter-balance.test.ts
      - name: Client - trait label visibility
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/trait-label-visibility.test.ts
      - name: Client - viewport classification
        if: always()
        run: cd apps/client && node --experimental-transform-types --test test/viewport-classification.test.ts
      - name: Build
        if: success()
        run: npm run build
