name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test content schema
        run: npm run test -w @frontline/content-schema
      - name: Test simulation
        run: npm run test -w @frontline/sim
      - name: Test client
        run: npm run test -w @frontline/client
      - name: Build
        run: npm run build
