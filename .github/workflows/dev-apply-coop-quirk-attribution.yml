name: Apply coop hidden achievement attribution bundle

on:
  push:
    paths:
      - .github/workflows/dev-apply-coop-quirk-attribution.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply bundle
        run: python tools/dev-apply-coop-quirk-attribution.py
      - name: Commit bundle
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: attribute co-op hidden achievements per player [skip ci]'
          git push origin HEAD:main
