          replace_exact('docs/IMPLEMENTATION_STATUS.md', '''- 현재 기본 보급소: Lv1 `12/s·1000` → Lv2 `16/s·1400` → Lv3 `22/s·1900` → Lv4 `29/s·2500` → Lv5 `38/s·3200` → Lv6 `49/s·4000` → Lv7 `62/s·5000` → Lv8 `78/s·6200`.
