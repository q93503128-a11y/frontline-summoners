name: Sync canonical balance docs
on:
  push:
    branches: [main]
    paths: [.github/workflows/sync-canonical-docs.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Replace stale canonical balance text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'exact stale block not found in {path}: {old[:80]!r}')
              if s.count(old) != 1:
                  raise SystemExit(f'expected one stale block in {path}, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))

          # CANONICAL: bump authority version and replace stale economy/start-supply description.
          replace_exact('docs/CANONICAL.md',
              '# Frontline Summoners 정본 v0.29 요약',
              '# Frontline Summoners 정본 v0.30 요약')
          replace_exact('docs/CANONICAL.md',
              'v0.29는 v0.28까지의 전투·경제·맵·수집·시각 식별성 규칙에 더해 **진화를 외형·애니메이션·VFX·전투 효과까지 변화하는 핵심 성장 시스템으로 고정**한다.',
              'v0.30은 v0.29까지의 전투·맵·수집·성장·진화 원칙을 유지하면서 **저보급 경제 재설계 이후 보급소 투자 가치와 제1장 캠페인 페이싱을 현재 구현 수치에 맞게 다시 고정**한다.')
          replace_exact('docs/CANONICAL.md', '''- 현재 제1장 프로토타입 기본 보급소:
  - Lv1: 12/초, 최대 1000
  - Lv2: 16/초, 최대 1400, 강화비 160
  - Lv3: 22/초, 최대 1900, 강화비 260
