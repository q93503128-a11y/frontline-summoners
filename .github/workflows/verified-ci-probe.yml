name: Verified CI probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verified-ci-probe.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Record verified success
        run: |
          printf 'verified_sha=%s\nverified_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/CI_PROBE_SUCCESS.txt
          git config user.name "frontline-ci"
          git config user.email "frontline-ci@users.noreply.github.com"
          git add docs/CI_PROBE_SUCCESS.txt
          git commit -m "chore: record verified CI probe success"
          git push origin HEAD:main
