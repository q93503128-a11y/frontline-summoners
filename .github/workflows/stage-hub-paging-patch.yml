name: Stage Hub Paging Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: contains(github.event.head_commit.message, 'run stage hub paging patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch sortie hub paging
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('apps/client/src/main.ts')
          source = main_path.read_text(encoding='utf-8')

          old_import = """  getStageCollection,\n  getStageCollectionForStage,\n  isStageCollectionUnlocked,\n  type StageCollection,\n"""
          new_import = """  getStageCollection,\n  getStageCollectionForStage,\n  getStageCollectionPage,\n  getStageCollectionPageCount,\n  isStageCollectionUnlocked,\n  type StageCollection,\n"""
          if old_import not in source:
              raise SystemExit('stage-navigation import anchor not found')
          source = source.replace(old_import, new_import, 1)

          start = source.index('class StageHubScene extends Phaser.Scene {')
          end = source.index('class StageSelectScene extends Phaser.Scene {')
          replacement = r'''class StageHubScene extends Phaser.Scene {
  private progress: GuestProgress = EMPTY_PROGRESS;
  private collectionLayer?: Phaser.GameObjects.Container;
  private page = 0;
  private pageText?: Phaser.GameObjects.Text;
  private previousButton?: Phaser.GameObjects.Container;
  private nextButton?: Phaser.GameObjects.Container;

  constructor() { super('stage-hub'); }

  create(): void {
    drawBackdrop(this, 'map');
    const compact = isCompactMobileViewport();
    addText(this, 54, 38, '출 정', 46, COLORS.cream);
    addText(this, 56, 94, compact ? '전선을 고르고 출격한다.' : '진도·특수전처럼 목적이 다른 전선 묶음을 먼저 고른다.', compact ? 22 : 19, COLORS.muted);
    addButton(this, 1165, compact ? 70 : 65, 160, compact ? 84 : 50, '메인', () => this.scene.start('main-menu'), 0x586275);
    this.previousButton = addButton(this, 72, 655, 115, compact ? 84 : 52, '◀ 전선', () => this.changePage(-1), 0x586275);
    this.nextButton = addButton(this, 1208, 655, 115, compact ? 84 : 52, '전선 ▶', () => this.changePage(1), 0x586275);
    this.pageText = addText(this, INTERNAL_WIDTH / 2, 640, '', compact ? 22 : 18, '#9ca9bb', 'center').setOrigin(0.5);

    this.renderCollections();
    void loadGuestProgress().then((progress) => {
      if (!this.scene.isActive()) return;
      this.progress = progress;
      this.renderCollections();
    });
  }

  private changePage(delta: number): void {
    const pageCount = getStageCollectionPageCount();
    this.page = Phaser.Math.Clamp(this.page + delta, 0, pageCount - 1);
    this.renderCollections();
  }

  private renderCollections(): void {
    this.collectionLayer?.destroy(true);
    this.collectionLayer = this.add.container(0, 0);
    const compact = isCompactMobileViewport();
    const pageCount = getStageCollectionPageCount();
    this.page = Phaser.Math.Clamp(this.page, 0, pageCount - 1);
    const visibleCollections = getStageCollectionPage(this.page);
    this.pageText?.setText(`전선 ${this.page + 1} / ${pageCount}`);
    this.previousButton?.setAlpha(this.page > 0 ? 1 : 0.38);
    this.nextButton?.setAlpha(this.page < pageCount - 1 ? 1 : 0.38);
    const positions = visibleCollections.length === 1 ? [INTERNAL_WIDTH / 2] : [380, 900];

    visibleCollections.forEach((collection, index) => {
      const x = positions[index] ?? INTERNAL_WIDTH / 2;
      const unlocked = isStageCollectionUnlocked(collection, this.progress.clearedStageIds);
      const cleared = getCollectionClearedIds(collection, this.progress.clearedStageIds, this.progress.specialClearedStageIds).length;
      const special = collection.stageType === 'SPECIAL';
      const accent = special ? 0x9066a6 : 0x6d8fb5;
      const card = this.add.rectangle(x, 365, compact ? 430 : 440, 390, unlocked ? (special ? 0x2b2535 : 0x242c3a) : 0x1d222c, 0.98)
        .setStrokeStyle(4, unlocked ? accent : 0x3c4554, 1);
      this.collectionLayer!.add(card);
      this.collectionLayer!.add(addText(this, x, 205, special ? 'SPECIAL' : 'PROGRESSION', compact ? 21 : 17, unlocked ? (special ? '#d6b5e8' : '#a9caee') : '#69727e', 'center').setOrigin(0.5));
      this.collectionLayer!.add(addText(this, x, 252, collection.title, compact ? 31 : 30, unlocked ? '#ffffff' : '#747d89', 'center').setOrigin(0.5).setWordWrapWidth(380));
      this.collectionLayer!.add(addText(this, x, 315, collection.description, compact ? 22 : 18, unlocked ? '#c5cedb' : '#656e7a', 'center').setOrigin(0.5).setWordWrapWidth(380));
      this.collectionLayer!.add(addText(this, x, 382, `${cleared} / ${collection.stages.length} 클리어`, compact ? 24 : 21, unlocked ? '#8ee3aa' : '#6c7580', 'center').setOrigin(0.5));
      const difficulties = collection.stages.map((stage) => stage.difficulty);
      const difficultyText = `난이도 ${Math.min(...difficulties)}~${Math.max(...difficulties)} / 12`;
      this.collectionLayer!.add(addText(this, x, 425, difficultyText, compact ? 21 : 17, unlocked ? COLORS.gold : '#6b6658', 'center').setOrigin(0.5));
      if (!unlocked) {
        const remaining = Math.max(0, collection.requiredProgressionClears - this.progress.clearedStageIds.length);
        this.collectionLayer!.add(addText(this, x, 470, `진도 ${remaining}개 더 클리어 필요`, compact ? 20 : 16, '#8b8290', 'center').setOrigin(0.5));
      }
      const button = addButton(this, x, compact ? 535 : 532, 250, compact ? 84 : 60, unlocked ? '스테이지 선택' : '잠김', () => {
        if (unlocked) this.scene.start('stage-select', { collectionId: collection.id });
      }, unlocked ? accent : 0x3f4855);
      if (!unlocked) button.setAlpha(0.62);
      this.collectionLayer!.add(button);
    });

    if (!compact) {
      this.collectionLayer.add(addText(this, INTERNAL_WIDTH / 2, 610, '전선 묶음은 2개씩 표시된다. 장·외전·이벤트가 늘어나도 같은 출정 허브에서 이동한다.', 16, '#8995a7', 'center').setOrigin(0.5));
    }
  }
}

'''
          source = source[:start] + replacement + source[end:]
          main_path.write_text(source, encoding='utf-8')

          test_path = Path('apps/client/test/stage-navigation.test.ts')
          test_source = test_path.read_text(encoding='utf-8')
          obsolete = """test('current hub cannot silently receive an off-screen third collection before its paging controls are wired', () => {\n  assert.ok(\n    STAGE_COLLECTIONS.length <= STAGE_COLLECTIONS_PER_PAGE,\n    'StageHubScene must consume getStageCollectionPage() and expose previous/next controls before adding collection 3+',\n  );\n});\n\n"""
          if obsolete not in test_source:
              raise SystemExit('temporary third-collection gate anchor not found')
          test_path.write_text(test_source.replace(obsolete, '', 1), encoding='utf-8')

          wiring = Path('apps/client/test/stage-hub-paging-wiring.test.ts')
          wiring.write_text(r'''import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';
import test from 'node:test';

async function readMain(): Promise<string> {
  return readFile(new URL('../src/main.ts', import.meta.url), 'utf8');
}

test('sortie hub consumes bounded collection paging instead of laying every future collection off-screen', async () => {
  const source = await readMain();
  const start = source.indexOf('class StageHubScene');
  const end = source.indexOf('class StageSelectScene');
  assert.ok(start >= 0 && end > start);
  const hub = source.slice(start, end);

  assert.match(source, /getStageCollectionPage,/);
  assert.match(source, /getStageCollectionPageCount,/);
  assert.match(hub, /private page = 0;/);
  assert.match(hub, /'◀ 전선'/);
  assert.match(hub, /'전선 ▶'/);
  assert.match(hub, /const pageCount = getStageCollectionPageCount\(\);/);
  assert.match(hub, /const visibleCollections = getStageCollectionPage\(this\.page\);/);
  assert.match(hub, /visibleCollections\.forEach\(\(collection, index\) =>/);
  assert.match(hub, /visibleCollections\.length === 1 \? \[INTERNAL_WIDTH \/ 2\] : \[380, 900\]/);
  assert.match(hub, /this\.pageText\?\.setText\(`전선 \$\{this\.page \+ 1\} \/ \$\{pageCount\}`\)/);
  assert.doesNotMatch(hub, /STAGE_COLLECTIONS\.map/);
  assert.doesNotMatch(hub, /STAGE_COLLECTIONS\.forEach/);
});
''', encoding='utf-8')
          PY

      - name: Install
        id: install
        continue-on-error: true
        run: npm install --ignore-scripts > /tmp/install.log 2>&1
      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck > /tmp/typecheck.log 2>&1
      - name: Test
        id: test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test > /tmp/test.log 2>&1
      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build > /tmp/build.log 2>&1

      - name: Commit verified patch or diagnostic
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -e
          ok=true
          [ "$INSTALL_OUTCOME" = "success" ] || ok=false
          [ "$TYPECHECK_OUTCOME" = "success" ] || ok=false
          [ "$TEST_OUTCOME" = "success" ] || ok=false
          [ "$BUILD_OUTCOME" = "success" ] || ok=false

          rm -f .github/workflows/stage-hub-paging-patch.yml
          git config user.name "frontline-summoners-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ "$ok" = true ]; then
            rm -f docs/STAGE_HUB_PATCH_RESULT.txt
            git add -A
            git commit -m "feat(stage-nav): paginate sortie collections"
          else
            git restore apps/client/src/main.ts apps/client/test/stage-navigation.test.ts
            rm -f apps/client/test/stage-hub-paging-wiring.test.ts
            {
              echo "Stage hub paging patch verification failed."
              echo "install=$INSTALL_OUTCOME"
              echo "typecheck=$TYPECHECK_OUTCOME"
              echo "test=$TEST_OUTCOME"
              echo "build=$BUILD_OUTCOME"
              for name in install typecheck test build; do
                echo
                echo "===== $name tail ====="
                tail -n 80 "/tmp/$name.log" 2>/dev/null || true
              done
            } > docs/STAGE_HUB_PATCH_RESULT.txt
            git add -A
            git commit -m "chore: record stage hub paging verification failure"
          fi
          git push origin HEAD:main
