<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111722" />
    <title>전선소환전 · Frontline Summoners</title>
    <style>
      html, body, #game { width: 100%; height: 100%; margin: 0; background: #111722; overflow: hidden; }
      body { touch-action: none; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      canvas { display: block; margin: 0 auto; }
      #orientation-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 32px;
        box-sizing: border-box;
        background: rgba(17, 23, 34, 0.985);
        color: #f4f0dc;
        text-align: center;
      }
      #orientation-hint strong { display: block; margin-bottom: 12px; font-size: 24px; color: #f5cf68; }
      #orientation-hint span { display: block; max-width: 330px; font-size: 16px; line-height: 1.55; color: #b8c0ce; }
      @media (orientation: portrait) and (max-width: 900px) {
        #orientation-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="orientation-hint" role="status" aria-live="polite">
      <div>
        <strong>가로 화면으로 돌려 주세요</strong>
        <span>전선과 10칸 소환 UI를 읽기 쉽게 보여 주기 위해 모바일 전투는 가로 화면을 기준으로 합니다. 회전하면 현재 화면이 그대로 이어집니다.</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
