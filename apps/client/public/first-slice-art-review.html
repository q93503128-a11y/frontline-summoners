<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontline Summoners · First Slice Art Review</title><style>
:root{color-scheme:dark;font-family:system-ui,"Malgun Gothic",sans-serif;background:#10141c;color:#eef2f7}body{margin:0;padding:24px;background:linear-gradient(#151b26,#0f131a)}header{max-width:1200px;margin:0 auto 18px}h1{margin:0 0 8px;font-size:28px}.warn{color:#ffd27a}.toolbar{display:flex;gap:10px;align-items:center;margin:14px 0}.toolbar button{background:#29364a;color:white;border:1px solid #607493;border-radius:8px;padding:8px 12px;cursor:pointer}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:16px}.card{background:#1a2230;border:1px solid #34445e;border-radius:12px;padding:14px}.card h2{margin:0 0 10px;font-size:20px}.motions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.motion{background:#111722;border-radius:8px;padding:7px;text-align:center}.motion canvas{width:100%;aspect-ratio:1/1;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#202a39 0 25%,#273244 0 50%) 0/16px 16px}.motion b{display:block;font-size:12px;margin-bottom:6px}.gray canvas{filter:grayscale(1) contrast(1.08)}small{color:#9eacc1}</style></head><body><header><h1>First production slice · runtime art review</h1><div class="warn">UNREVIEWED · 이 페이지는 승인 상태를 변경하지 않음</div><div class="toolbar"><button id="gray">흑백 실루엣 토글</button><span id="status">metadata 불러오는 중…</span></div></header><main id="grid" class="grid"></main><script>
const labels={'militia/militia_f1':'징집병 F1','militia/militia_f2':'정규보병 F2','militia/militia_f3':'노련한 전선병 F3','enemy-raider':'약탈병'};const motions=['idle','move','attack','knockback','death'];
const grid=document.querySelector('#grid');const status=document.querySelector('#status');document.querySelector('#gray').onclick=()=>document.body.classList.toggle('gray');
const meta=await fetch('/assets/production/units/first-slice-runtime-metadata.json').then(r=>{if(!r.ok)throw new Error('production metadata 없음 · 먼저 materialize 실행 필요');return r.json()});status.textContent=`generator v${meta.generatorVersion} · ${meta.reviewStatus}`;
for(const [target,t] of Object.entries(meta.targets)){const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${labels[target]??target}</h2><small>base ${t.sourceFamily} · contact frame ${t.attackContactFrame}</small><div class="motions"></div>`;const holder=card.querySelector('.motions');for(const motion of motions){const e=t.motions[motion],wrap=document.createElement('div');wrap.className='motion';wrap.innerHTML=`<b>${motion}</b><canvas width="${e.frameWidth}" height="${e.frameHeight}"></canvas>`;holder.append(wrap);const canvas=wrap.querySelector('canvas'),ctx=canvas.getContext('2d'),img=new Image();img.src=e.url;await img.decode();let frame=0;setInterval(()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(img,frame*e.frameWidth,0,e.frameWidth,e.frameHeight,0,0,e.frameWidth,e.frameHeight);frame=(frame+1)%e.frames;},motion==='attack'?120:motion==='move'?95:150);}grid.append(card)}
</script></body></html>
