<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontline Summoners · First Slice Art Review</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Malgun Gothic",sans-serif;background:#0c1118;color:#eef2f7}*{box-sizing:border-box}body{margin:0;background:#0c1118}header{position:sticky;top:0;z-index:10;background:#111823ee;backdrop-filter:blur(10px);border-bottom:1px solid #2e3d52;padding:14px 20px}.head{max-width:1280px;margin:auto;display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0}.warn{color:#ffd27a;font-size:13px;margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{background:#243248;color:#fff;border:1px solid #607493;border-radius:8px;padding:8px 11px;cursor:pointer}.toolbar button.active{background:#526f97}.wrap{max-width:1280px;margin:auto;padding:18px}.status{color:#9eacc1;margin-bottom:14px}.section{margin:0 0 24px}.section h2{font-size:20px;margin:0 0 10px}.board{position:relative;border:1px solid #34445e;border-radius:14px;overflow:hidden;background:#182333}.battle{height:440px;position:relative;overflow:hidden;background:linear-gradient(#8eb4c4 0 44%,#78935f 44% 60%,#5f6d49 60%)}.battle.dark{background:linear-gradient(#1b2636 0 44%,#26372d 44% 60%,#1c261d 60%)}.battle::before{content:"";position:absolute;inset:44% 0 auto;height:16%;background:linear-gradient(90deg,#8fa46d55,#788f6155 45%,#9dad7855)}.battle::after{content:"";position:absolute;left:0;right:0;bottom:24%;height:4px;background:#c7d3a433;box-shadow:0 14px 28px #0005}.groundnote{position:absolute;left:12px;bottom:10px;font-size:12px;color:#e8f2ddaa}.actor{position:absolute;transform-origin:50% 100%}.actor canvas{position:absolute;left:50%;bottom:0;transform:translateX(-50%);image-rendering:pixelated}.actor.enemy canvas{transform:translateX(-50%) scaleX(-1)}.actor .name{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:#edf3f7;text-shadow:0 1px 3px #000}.actor .shadow{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:54px;height:10px;border-radius:50%;background:#0005}.gray canvas{filter:grayscale(1) contrast(1.15)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(500px,1fr));gap:14px}.card{background:#151e2b;border:1px solid #34445e;border-radius:12px;padding:13px}.card h3{margin:0 0 8px;font-size:18px}.meta{font-size:12px;color:#9eacc1;margin-bottom:9px}.motions{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.motion{background:#0d141e;border-radius:8px;padding:6px;text-align:center;overflow:hidden}.motion b{display:block;font-size:11px;margin-bottom:5px}.motion canvas{width:100%;aspect-ratio:1/1;image-rendering:pixelated;background:repeating-conic-gradient(#202a39 0 25%,#273244 0 50%) 0/16px 16px}.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.contact-card{background:#151e2b;border:1px solid #34445e;border-radius:10px;padding:9px}.contact-stage{height:190px;position:relative;background:#263548;border-radius:8px;overflow:hidden}.contact-stage canvas{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);height:160px;width:auto;image-rendering:pixelated}.contact-stage.enemy canvas{transform:translateX(-50%) scaleX(-1)}.impact{position:absolute;right:34px;top:78px;width:24px;height:24px;border:2px solid #ff7676;border-radius:50%;box-shadow:0 0 0 6px #ff767622}.impact::after,.impact::before{content:"";position:absolute;background:#ff7676}.impact::after{width:38px;height:2px;left:-9px;top:9px}.impact::before{width:2px;height:38px;left:9px;top:-9px}.contact-label{font-size:12px;color:#c5d0dd;margin-top:6px}.small-board{height:280px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#aebacc;margin-top:8px}@media(max-width:700px){.wrap{padding:10px}.battle{height:360px}.cards{grid-template-columns:1fr}.motions{grid-template-columns:repeat(3,1fr)}h1{font-size:20px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>First production slice · battle-scale review</h1><div class="warn">UNREVIEWED · 여기서 보이는 파일은 승인 상태를 변경하지 않음</div></div><div class="toolbar"><button id="gray">흑백</button><button id="bright" class="active">밝은 전장</button><button id="dark">어두운 전장</button><button id="pause">일시정지</button></div></div></header>
<div class="wrap">
<div id="status" class="status">metadata 불러오는 중…</div>
<section class="section"><h2>1. 실제 전투 스케일 · 8~12기 중첩</h2><div class="board"><div id="battle" class="battle"><div class="groundnote">작은 화면/혼전 가독성 확인용 · 실제 게임 판정/AI는 실행하지 않음</div></div></div><div class="legend"><span>아군: F1/F2/F3</span><span>적: 약탈병</span><span>색상 없이도 F1→F2→F3와 약탈병이 구분되는지 확인</span></div></section>
<section class="section"><h2>2. 공격 contact frame 고정 비교</h2><div id="contacts" class="contact-grid"></div></section>
<section class="section"><h2>3. 5모션 원본 크롭</h2><div id="cards" class="cards"></div></section>
</div>
<script type="module">
const labels={'militia/militia_f1':'징집병 F1','militia/militia_f2':'정규보병 F2','militia/militia_f3':'노련한 전선병 F3','enemy-raider':'약탈병','enemy-boss':'황금가면 사령술사'};
const motions=['idle','move','attack','knockback','death'];
const status=document.querySelector('#status'),battle=document.querySelector('#battle'),cards=document.querySelector('#cards'),contacts=document.querySelector('#contacts');
let paused=false,gray=false,dark=false;const loops=[];
function setGray(v){gray=v;document.body.classList.toggle('gray',v);document.querySelector('#gray').classList.toggle('active',v)}
function setDark(v){dark=v;battle.classList.toggle('dark',v);document.querySelector('#dark').classList.toggle('active',v);document.querySelector('#bright').classList.toggle('active',!v)}
document.querySelector('#gray').onclick=()=>setGray(!gray);document.querySelector('#bright').onclick=()=>setDark(false);document.querySelector('#dark').onclick=()=>setDark(true);document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').classList.toggle('active',paused);document.querySelector('#pause').textContent=paused?'재생':'일시정지'};
const meta=await fetch('/assets/production/units/first-slice-runtime-metadata.json').then(r=>{if(!r.ok)throw new Error('production metadata 없음');return r.json()});status.textContent=`generator v${meta.generatorVersion} · ${Object.keys(meta.targets).length} targets · ${meta.reviewStatus}`;
async function loadImg(url){const img=new Image();img.src=url;await img.decode();return img}
function drawFrame(ctx,img,e,frame,flip=false){ctx.clearRect(0,0,e.frameWidth,e.frameHeight);ctx.imageSmoothingEnabled=false;if(flip){ctx.save();ctx.translate(e.frameWidth,0);ctx.scale(-1,1);ctx.drawImage(img,frame*e.frameWidth,0,e.frameWidth,e.frameHeight,0,0,e.frameWidth,e.frameHeight);ctx.restore()}else ctx.drawImage(img,frame*e.frameWidth,0,e.frameWidth,e.frameHeight,0,0,e.frameWidth,e.frameHeight)}
function animate(ctx,img,e,ms,flip=false,start=0){let frame=start,last=performance.now();function tick(now){if(!paused&&now-last>=ms){frame=(frame+1)%e.frames;drawFrame(ctx,img,e,frame,flip);last=now}requestAnimationFrame(tick)}drawFrame(ctx,img,e,frame,flip);requestAnimationFrame(tick)}
for(const [target,t] of Object.entries(meta.targets)){
  const card=document.createElement('article');card.className='card';card.innerHTML=`<h3>${labels[target]??target}</h3><div class="meta">base ${t.sourceFamily} · displayH ${t.displayHeight} · attack contact ${t.attackContactFrame}</div><div class="motions"></div>`;const holder=card.querySelector('.motions');
  for(const motion of motions){const e=t.motions[motion],wrap=document.createElement('div');wrap.className='motion';wrap.innerHTML=`<b>${motion}</b><canvas width="${e.frameWidth}" height="${e.frameHeight}"></canvas>`;holder.append(wrap);const canvas=wrap.querySelector('canvas'),ctx=canvas.getContext('2d'),img=await loadImg(e.url);animate(ctx,img,e,motion==='attack'?115:motion==='move'?90:145,target.startsWith('enemy'))}
  cards.append(card);
  const e=t.motions.attack,img=await loadImg(e.url),cc=document.createElement('div');cc.className='contact-card';cc.innerHTML=`<b>${labels[target]??target}</b><div class="contact-stage ${target.startsWith('enemy')?'enemy':''}"><canvas width="${e.frameWidth}" height="${e.frameHeight}"></canvas><div class="impact"></div></div><div class="contact-label">attack frame ${t.attackContactFrame}/${e.frames-1}</div>`;contacts.append(cc);drawFrame(cc.querySelector('canvas').getContext('2d'),img,e,Math.min(t.attackContactFrame,e.frames-1),false);
}
const crowdPattern=['militia/militia_f1','militia/militia_f2','militia/militia_f3','militia/militia_f1','militia/militia_f2','militia/militia_f3','enemy-raider','enemy-raider','enemy-raider','enemy-raider','enemy-raider','enemy-raider'];
for(let i=0;i<crowdPattern.length;i++){
  const target=crowdPattern[i],t=meta.targets[target];if(!t)continue;const enemy=target.startsWith('enemy'),motion=i%4===0?'idle':'move',e=t.motions[motion],img=await loadImg(e.url),actor=document.createElement('div');actor.className=`actor ${enemy?'enemy':''}`;actor.style.left=`${enemy?61+(i-6)*5.1:9+i*6.1}%`;actor.style.bottom=`${22+(i%3)*2}px`;actor.style.zIndex=String(20+(i%3));const displayH=Math.round((t.displayHeight||176)*0.72);actor.innerHTML=`<div class="shadow"></div><canvas width="${e.frameWidth}" height="${e.frameHeight}" style="height:${displayH}px;width:auto"></canvas><div class="name">${labels[target]??target}</div>`;battle.append(actor);animate(actor.querySelector('canvas').getContext('2d'),img,e,motion==='move'?92:150,false,i%e.frames)
}
</script>
</body>
</html>
